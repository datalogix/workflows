name: Deploy step
description: One step of a deploy or rollback to Laravel Forge or Laravel Cloud, with the release history kept in refs/datalogix/*. The deploy workflow sets the environment it reads (MODE, PROVIDER, ENVIRONMENT, DEPLOY_HOOK, HEALTH_URL, LANGUAGE and the step's own values).

inputs:
  step:
    description: check, choose, deploy, settle, watch, rollback, open-issue or report-rollback
    required: true

outputs:
  sha:
    description: Commit to deploy (choose)
    value: ${{ steps.run.outputs.sha }}
  from:
    description: Release being rolled back (choose, in rollback mode)
    value: ${{ steps.run.outputs.from }}
  target:
    description: Release the automatic rollback returned to (rollback)
    value: ${{ steps.run.outputs.target }}

runs:
  using: composite

  steps:
    - id: run
      shell: bash
      env:
        STEP: ${{ inputs.step }}
      run: bash "$GITHUB_ACTION_PATH/deploy.sh" "$STEP"
