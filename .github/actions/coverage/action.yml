name: Datalogix coverage
description: Fails when the Clover report written by the tests covers less than the minimum percentage of statements, methods and conditionals

inputs:
  min-coverage:
    description: Minimum percentage (0 to 100); 0 checks nothing
    required: true
  since:
    description: File touched before the tests ran; a report older than it is ignored (empty accepts any report)
    default: ""

runs:
  using: composite

  steps:
    - shell: bash
      env:
        MIN_COVERAGE: ${{ inputs.min-coverage }}
        SINCE: ${{ inputs.since }}
      run: bash "$GITHUB_ACTION_PATH/coverage.sh"
