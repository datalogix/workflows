name: Datalogix coverage
description: Shows the coverage of the Clover report written by the tests in the job summary, and fails when it covers less than the minimum percentage of statements, methods and conditionals

inputs:
  min-coverage:
    description: Minimum percentage (0 to 100); 0 only shows the coverage, and a missing report is only noted
    required: true
  since:
    description: File touched before the tests ran; a report older than it is ignored (empty accepts any report)
    default: ""

runs:
  using: composite

  steps:
    - shell: bash
      env:
        MIN_COVERAGE: ${{ inputs.min-coverage }}
        SINCE: ${{ inputs.since }}
      run: bash "$GITHUB_ACTION_PATH/coverage.sh"
