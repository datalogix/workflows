name: node-package-tests

# Tests of a JavaScript or TypeScript library, called by package.yml with stack: js. The package.json scripts are the
# checks: test runs on every Node version of the matrix; typecheck, lint, build, the lint command and the audit run once.

on:
  workflow_call:
    inputs:
      os:
        type: string
        default: '["ubuntu-latest"]'
        description: JSON list of runners
      node:
        type: string
        default: '["22", "24", "26"]'
        description: JSON list of Node versions the tests run on
      test-command:
        type: string
        default: ""
        description: Empty runs the test script of package.json when it has one; none skips the tests
      min-coverage:
        type: number
        default: 100
        description: Minimum coverage of the tests, in percent of statements, methods and conditionals, read from the Clover report they write (e.g. Vitest's clover reporter, in coverage/); 0 checks nothing, on the first runner of os
      api-check:
        type: boolean
        default: false
        description: Check what the library publishes after the build (publint, and the types of every entry point with @arethetypeswrong/cli)
      eslint:
        type: boolean
        default: true
        description: Run ESLint, when package.json declares it, it has a config and there is no lint (or check) script
      prettier:
        type: boolean
        default: true
        description: Run Prettier (or the format:check script), when package.json declares it, it has a config and the lint script does not run it
      stylelint:
        type: boolean
        default: true
        description: Run Stylelint (or the lint:css script), when package.json declares it, it has a config and the lint script does not run it
      lint-command:
        type: string
        default: ""
        description: Extra lint command run once after the build, so it can check what is published (e.g. npx publint); empty runs none
      audit:
        type: boolean
        default: true
        description: Audit the dependencies (high and critical advisories) on pull requests that change the lockfile, and on scheduled and manual runs
      timeout-minutes:
        type: number
        default: 30

jobs:
  tests:
    if: inputs.test-command != 'none'

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    timeout-minutes: ${{ inputs.timeout-minutes }}

    # A new push to a PR cancels the previous run; runs on main always finish
    concurrency:
      group: ${{ github.workflow }}-tests-${{ matrix.os }}-${{ matrix.node }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node) }}

    name: Node ${{ matrix.node }} (${{ matrix.os }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JavaScript
        id: setup
        uses: datalogix/workflows/.github/actions/setup-js@v2
        with:
          node-version: ${{ matrix.node }}

      - name: Tests
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          RUN: ${{ steps.setup.outputs.run }}
        run: |
          # The coverage check ignores a report older than this
          touch "$RUNNER_TEMP/tests-started"
          if [ -n "$TEST_COMMAND" ]; then
            eval "$TEST_COMMAND"
          # npm init writes a test script that only fails
          elif jq -e '.scripts.test // "" | select(. != "" and (contains("no test specified") | not))' package.json >/dev/null; then
            $RUN test
          else
            echo "::notice::No test script in package.json: no tests ran"
          fi

      # Every runner measures the same code, so only the first one checks it.
      # Without tests, no report: the check fails
      - name: Coverage
        if: inputs.min-coverage != 0 && matrix.os == fromJSON(inputs.os)[0]
        uses: datalogix/workflows/.github/actions/coverage@v2
        with:
          min-coverage: ${{ inputs.min-coverage }}
          since: ${{ runner.temp }}/tests-started

  # Once, on the Node version of .nvmrc or .node-version, otherwise the current LTS
  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: ${{ inputs.timeout-minutes }}

    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Each check below runs even when an earlier one failed, so a run reports every failure at once; none runs
      # without the dependencies
      - name: Setup JavaScript
        id: setup
        uses: datalogix/workflows/.github/actions/setup-js@v2

      - name: Detect package.json scripts
        id: scripts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          # The first of the names that package.json defines
          first() {
            for script in "$@"; do
              if jq -e --arg script "$script" '.scripts[$script] // "" | select(. != "")' package.json >/dev/null; then
                echo "$script"
                return
              fi
            done
            echo "No $1 script in package.json, skipping" >&2
          }

          # types:check is the name in the Laravel starter kits, type-check create-vue's; check is Vite+'s (vp check)
          {
            echo "typecheck=$(first typecheck types:check type-check)"
            echo "lint=$(first lint check)"
            echo "build=$(first build)"
          } >> "$GITHUB_OUTPUT"

      # The typecheck and lint scripts must check, not fix: the step after them fails when they changed a tracked file
      - name: Snapshot the working tree
        id: snapshot
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
        # A commit of the tracked files as installing left them (HEAD when it changed none), without touching them
        run: |
          snapshot=$(git stash create)
          echo "ref=${snapshot:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.scripts.outputs.typecheck }}
        shell: bash
        env:
          RUN: ${{ steps.setup.outputs.run }}
          SCRIPT: ${{ steps.scripts.outputs.typecheck }}
        run: $RUN "$SCRIPT"

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.scripts.outputs.lint }}
        shell: bash
        env:
          RUN: ${{ steps.setup.outputs.run }}
          SCRIPT: ${{ steps.scripts.outputs.lint }}
        run: $RUN "$SCRIPT"

      # ESLint, Prettier and Stylelint, each one the lint script does not run already: on the files the pull request or
      # the merge queue group changes, on every tracked file on other events
      - name: JS style
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: datalogix/workflows/.github/actions/js-lint@v2
        with:
          eslint: ${{ inputs.eslint }}
          prettier: ${{ inputs.prettier }}
          stylelint: ${{ inputs.stylelint }}

      - name: Check that lint changed no files
        if: ${{ !cancelled() && steps.snapshot.outputs.ref }}
        shell: bash
        env:
          SNAPSHOT: ${{ steps.snapshot.outputs.ref }}
        run: |
          if ! git diff --quiet "$SNAPSHOT"; then
            echo "::error::The typecheck or lint script changed tracked files: it must check, not fix (e.g. eslint . instead of eslint . --fix, prettier --check instead of prettier --write)"
            git diff --stat "$SNAPSHOT"
            exit 1
          fi

      # A library that does not build cannot be published
      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.scripts.outputs.build }}
        shell: bash
        env:
          RUN: ${{ steps.setup.outputs.run }}
        run: $RUN build

      # After the build: what npm would publish (the files, exports and types of package.json)
      - name: Published package
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.api-check }}
        shell: bash
        run: |
          status=0
          npx --yes publint || status=1
          npx --yes @arethetypeswrong/cli --pack . || status=1
          exit "$status"

      # After the build, so tools that read what is published (npx publint, npx attw --pack .) find it
      - name: Lint command
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.lint-command != '' }}
        shell: bash
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: eval "$LINT_COMMAND"

      # On PRs only when the lockfile changes, so a new advisory does not block unrelated PRs; scheduled runs catch
      # advisories published after the dependencies were installed. Fails on high and critical advisories only, as
      # npm reports many low ones
      - name: Audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.audit && steps.setup.outputs.lockfile != '' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          LOCKFILE: ${{ steps.setup.outputs.lockfile }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet "origin/$BASE...HEAD" -- "$LOCKFILE"; then
            echo "$LOCKFILE did not change, skipping"
            exit 0
          fi

          case "$LOCKFILE" in
            pnpm-lock.yaml) pnpm audit --audit-level high ;;
            package-lock.json) npm audit --audit-level=high ;;
            yarn.lock)
              if [ "$(yarn --version | cut -d. -f1)" = 1 ]; then
                # Yarn 1 exits with a bit mask of the severities found: 8 is high, 16 critical
                status=0
                yarn audit --level high || status=$?
                [ "$status" -lt 8 ]
              else
                yarn npm audit --recursive --severity high
              fi
              ;;
          esac

  # Single status check for branch protection and merge queues, so it does not depend on the matrix job names
  all-checks:
    if: always()

    needs: [tests, lint]

    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Check results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            # tests is skipped with test-command none
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
