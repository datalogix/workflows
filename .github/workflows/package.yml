name: package

# Every workflow a Laravel package, a PHP package or a JavaScript library needs, behind a single file in the package
# (examples/package.yml). New layers are added here, so packages get them without changing their file.
#
# Required checks (branch ruleset): <calling job> / tests / all-checks, and <calling job> / security / security with the
# security review. The tests job of each stack is named tests, so the check is the same; the one of the other stack is
# skipped in the caller, so it never reports that check.
#
# The Claude layers (claude, review, security-review) are off by default: a package file written before them grants
# only contents: read and none of their events. Their jobs set no permissions of their own, so they take the caller's,
# and the called workflows ask for theirs; turning a layer on needs the events and permissions of examples/package.yml.

on:
  workflow_call:
    inputs:
      stack:
        type: string
        default: laravel
        description: Stack of the package, which picks its tests (laravel, php for a PHP package without Laravel, or js)
      tests:
        type: boolean
        default: true
        description: Run the test suite across the matrix and the lint checks (laravel-package-tests, without the Laravel axis for php, or node-package-tests for js)
      claude:
        type: boolean
        default: false
        description: Let Claude answer @claude on issues and pull requests, implement issues labeled claude, plan issues labeled claude-plan, and fix failed tests on its own pull requests
      review:
        type: boolean
        default: false
        description: Claude reviews each pull request once (opened, reopened or ready for review)
      security-review:
        type: boolean
        default: false
        description: Claude reviews the security of each pull request and fails the check on findings of security-fail-on or higher (required check pipeline / security / security)
      risk-gate:
        type: boolean
        default: false
        description: Label pull requests by risk and require human approvals according to it (required check pipeline / gate / gate)

      # Passed to laravel-package-tests (and os, test-command, min-coverage, lint-command and timeout-minutes to
      # node-package-tests), with the same defaults
      node:
        type: string
        default: '["22", "24", "26"]'
        description: JSON list of Node versions the tests of a js package run on
      os:
        type: string
        default: '["ubuntu-latest"]'
      php:
        type: string
        default: '["8.2", "8.3", "8.4", "8.5"]'
      laravel:
        type: string
        default: '["^12.0", "^13.0"]'
        description: Laravel versions of the matrix; ignored with stack php, which installs no framework
      stability:
        type: string
        default: '["prefer-lowest", "prefer-stable"]'
      exclude:
        type: string
        default: |
          [
            {"laravel": "^13.0", "php": "8.2"},
            {"stability": "prefer-lowest", "php": "8.4"},
            {"stability": "prefer-lowest", "php": "8.5"}
          ]
      extensions:
        type: string
        default: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
      test-command:
        type: string
        default: ""
        description: Empty runs composer test when composer.json defines it, otherwise vendor/bin/pest when Pest is installed, otherwise vendor/bin/phpunit, and for js the test script of package.json; none skips the test suite
      coverage:
        type: boolean
        default: true
        description: Upload coverage to Codecov from the newest combination of the matrix (highest PHP and Laravel, prefer-stable, first OS)
      min-coverage:
        type: number
        default: 100
        description: Minimum coverage of the tests, in percent of statements, methods and conditionals, read from the Clover report they write (on the newest combination of the matrix, or for js on the first runner of os); 0 checks nothing
      coverage-driver:
        type: string
        default: pcov
        description: pcov (faster) or xdebug
      timeout-minutes:
        type: number
        default: 30
      pint:
        type: boolean
        default: true
        description: Run Laravel Pint on the files changed by the PR (requires Pint 1.20+ in require-dev)
      phpstan:
        type: boolean
        default: true
        description: Run PHPStan once, on the highest PHP version of the matrix, when composer.json requires it (phpstan/phpstan or Larastan)
      api-check:
        type: boolean
        default: false
        description: "Check the public API: on pull requests, fail on changes that break it (laravel and php, with roave/backward-compatibility-check against the base branch); for js, check what the library publishes (publint and @arethetypeswrong/cli)"
      lint-command:
        type: string
        default: ""
        description: Extra lint command run once after Pint and PHPStan (e.g. composer lint:check), or for js after the build (e.g. npx publint); empty runs none

      # Claude (with claude, review or security-review)
      model:
        type: string
        default: opus
        description: Model for replies, implementation and reviews
      plan-model:
        type: string
        default: best
        description: Model for plans
      fix-ci-model:
        type: string
        default: sonnet
        description: Model for CI fixes
      extra-instructions:
        type: string
        default: ""
        description: Extra instructions for this package, given to every Claude workflow (no double quotes)
      language:
        type: string
        default: pt-BR
        description: Language of what is written for the team (issues, pull requests, comments, commits; no double quotes). Claude writes in any language; the fixed texts exist in pt-BR and en, and other languages get pt-BR
      approvals-medium:
        type: number
        default: 1
        description: Human approvals a medium-risk pull request needs of its current changes
      approvals-high:
        type: number
        default: 1
        description: Human approvals a high-risk pull request needs of its current changes
      count-author:
        type: boolean
        default: false
        description: Count a human pull request author with write access as one approval (for solo maintainers)
      extra-high-risk-paths:
        type: string
        default: ""
        description: More patterns (one per line, * also matches /) that make a pull request high risk, added to the package defaults of the stack
      security-fail-on:
        type: string
        default: high
        description: Lowest security finding severity that fails the check (high, medium, low or none)
    secrets:
      CODECOV_TOKEN:
        required: false
      # Only the Claude layers use it, and they are off by default
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  # Fails the run for an unsupported stack; the other jobs check inputs.stack in their condition, so no runner starts
  # just to check it on every event
  stack:
    if: ${{ !contains(fromJSON('["laravel", "php", "js"]'), inputs.stack) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the stack
        shell: bash
        env:
          STACK: ${{ inputs.stack }}
        run: |
          echo "::error::stack '$STACK' is not supported; use laravel, php or js"
          exit 1

  # Laravel and PHP packages share laravel-package-tests: php runs it with an empty Laravel axis ('[""]'), so no
  # framework is installed
  tests:
    if: contains(fromJSON('["laravel", "php"]'), inputs.stack) && inputs.tests && contains(fromJSON('["push", "pull_request", "merge_group", "schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
    uses: datalogix/workflows/.github/workflows/laravel-package-tests.yml@v2
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      os: ${{ inputs.os }}
      php: ${{ inputs.php }}
      laravel: ${{ inputs.stack == 'php' && '[""]' || inputs.laravel }}
      stability: ${{ inputs.stability }}
      exclude: ${{ inputs.exclude }}
      extensions: ${{ inputs.extensions }}
      test-command: ${{ inputs.test-command }}
      coverage: ${{ inputs.coverage }}
      min-coverage: ${{ inputs.min-coverage }}
      coverage-driver: ${{ inputs.coverage-driver }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      pint: ${{ inputs.pint }}
      phpstan: ${{ inputs.phpstan }}
      lint-command: ${{ inputs.lint-command }}
      api-check: ${{ inputs.api-check }}

  js-tests:
    # Same name as the Laravel job: the required check is <calling job> / tests / all-checks for every stack
    name: tests
    if: inputs.stack == 'js' && inputs.tests && contains(fromJSON('["push", "pull_request", "merge_group", "schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
    uses: datalogix/workflows/.github/workflows/node-package-tests.yml@v2
    with:
      os: ${{ inputs.os }}
      node: ${{ inputs.node }}
      test-command: ${{ inputs.test-command }}
      min-coverage: ${{ inputs.min-coverage }}
      lint-command: ${{ inputs.lint-command }}
      api-check: ${{ inputs.api-check }}
      timeout-minutes: ${{ inputs.timeout-minutes }}

  # The Claude jobs set no permissions: they take the caller's (see the top of this file). Those that write or review
  # code get the package rule (keep the public API compatible) in front of extra-instructions, without double quotes,
  # as it ends up in --append-system-prompt
  claude:
    if: contains(fromJSON('["laravel", "php", "js"]'), inputs.stack) && inputs.claude && contains(fromJSON('["issues", "issue_comment", "pull_request_review_comment", "pull_request_review"]'), github.event_name)
    uses: datalogix/workflows/.github/workflows/claude.yml@v2
    secrets: inherit
    with:
      stack: ${{ inputs.stack == 'js' && 'js' || inputs.stack == 'php' && 'php' || 'laravel' }}
      model: ${{ inputs.model }}
      plan-model: ${{ inputs.plan-model }}
      extra-instructions: This repository is a published package, whose public API (public classes, methods, functions, config keys and exports) is used by apps you cannot see. Report, or in your own changes avoid, any change that breaks it (removed or renamed, a changed signature, return type or default behavior) unless the issue or pull request asks for a major version; prefer deprecating and adding. ${{ inputs.extra-instructions }}
      language: ${{ inputs.language }}

  # Once per pull request (opened, reopened or ready for review), not on every push: ask @claude for another review
  review:
    if: contains(fromJSON('["laravel", "php", "js"]'), inputs.stack) && inputs.review && github.event_name == 'pull_request' && github.event.action != 'synchronize'
    uses: datalogix/workflows/.github/workflows/claude-review.yml@v2
    secrets: inherit
    with:
      stack: ${{ inputs.stack == 'js' && 'js' || inputs.stack == 'php' && 'php' || 'laravel' }}
      model: ${{ inputs.model }}
      extra-instructions: This repository is a published package, whose public API (public classes, methods, functions, config keys and exports) is used by apps you cannot see. Report, or in your own changes avoid, any change that breaks it (removed or renamed, a changed signature, return type or default behavior) unless the issue or pull request asks for a major version; prefer deprecating and adding. ${{ inputs.extra-instructions }}
      language: ${{ inputs.language }}

  # Pull requests from forks are skipped inside claude-security-review: the check passes without a review
  security:
    if: contains(fromJSON('["laravel", "php", "js"]'), inputs.stack) && inputs.security-review && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    uses: datalogix/workflows/.github/workflows/claude-security-review.yml@v2
    secrets: inherit
    with:
      stack: ${{ inputs.stack == 'js' && 'js' || inputs.stack == 'php' && 'php' || 'laravel' }}
      model: ${{ inputs.model }}
      fail-on: ${{ inputs.security-fail-on }}
      extra-instructions: ${{ inputs.extra-instructions }}
      language: ${{ inputs.language }}

  # The patterns of a package of the stack (kind package); like the Claude jobs, no job-level permissions, so an older
  # package file that grants only contents: read declares no conflict
  gate:
    if: contains(fromJSON('["laravel", "php", "js"]'), inputs.stack) && inputs.risk-gate && contains(fromJSON('["pull_request", "pull_request_review", "merge_group"]'), github.event_name)
    uses: datalogix/workflows/.github/workflows/risk-gate.yml@v2
    with:
      stack: ${{ inputs.stack == 'js' && 'js' || inputs.stack == 'php' && 'php' || 'laravel' }}
      kind: package
      approvals-medium: ${{ inputs.approvals-medium }}
      approvals-high: ${{ inputs.approvals-high }}
      count-author: ${{ inputs.count-author }}
      extra-high-risk-paths: ${{ inputs.extra-high-risk-paths }}
      language: ${{ inputs.language }}

  # With claude: Claude's own pull requests (claude/ branches) only exist when it implements issues. In the same run as
  # the tests, so no separate workflow_run trigger is needed; Claude gets one PHP or Node version, not the matrix
  fix-ci:
    needs: [tests, js-tests]
    if: ${{ !cancelled() && contains(fromJSON('["laravel", "php", "js"]'), inputs.stack) && inputs.claude && github.event_name == 'pull_request' && (needs.tests.result == 'failure' || needs.js-tests.result == 'failure') }}
    uses: datalogix/workflows/.github/workflows/claude-fix-ci.yml@v2
    secrets: inherit
    with:
      stack: ${{ inputs.stack == 'js' && 'js' || inputs.stack == 'php' && 'php' || 'laravel' }}
      model: ${{ inputs.fix-ci-model }}
      extra-instructions: This repository is a published package, whose public API (public classes, methods, functions, config keys and exports) is used by apps you cannot see. Report, or in your own changes avoid, any change that breaks it (removed or renamed, a changed signature, return type or default behavior) unless the issue or pull request asks for a major version; prefer deprecating and adding. ${{ inputs.extra-instructions }}
      language: ${{ inputs.language }}
