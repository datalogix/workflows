name: package

# Every workflow a Laravel package or a JavaScript library needs, behind a single file in the package
# (examples/package.yml). New layers are added here, so packages get them without changing their file.
#
# Required checks (branch ruleset): <calling job> / tests / all-checks. The tests job of each stack is named tests, so
# the check is the same; the one of the other stack is skipped in the caller, so it never reports that check.

on:
  workflow_call:
    inputs:
      stack:
        type: string
        default: laravel
        description: Stack of the package, which picks its tests (laravel or js)
      tests:
        type: boolean
        default: true
        description: Run the test suite across the matrix and the lint checks (laravel-package-tests, or node-package-tests for js)

      # Passed to laravel-package-tests (and os, test-command, lint-command and timeout-minutes to node-package-tests),
      # with the same defaults
      node:
        type: string
        default: '["22", "24", "26"]'
        description: JSON list of Node versions the tests of a js package run on
      os:
        type: string
        default: '["ubuntu-latest"]'
      php:
        type: string
        default: '["8.2", "8.3", "8.4", "8.5"]'
      laravel:
        type: string
        default: '["^12.0", "^13.0"]'
      stability:
        type: string
        default: '["prefer-lowest", "prefer-stable"]'
      exclude:
        type: string
        default: |
          [
            {"laravel": "^13.0", "php": "8.2"},
            {"stability": "prefer-lowest", "php": "8.4"},
            {"stability": "prefer-lowest", "php": "8.5"}
          ]
      extensions:
        type: string
        default: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
      test-command:
        type: string
        default: ""
        description: Empty runs composer test when composer.json defines it, otherwise vendor/bin/pest when Pest is installed, otherwise vendor/bin/phpunit, and for js the test script of package.json; none skips the test suite
      coverage:
        type: boolean
        default: true
        description: Collect and upload coverage on the newest combination of the matrix (highest PHP and Laravel, prefer-stable, first OS)
      coverage-driver:
        type: string
        default: pcov
        description: pcov (faster) or xdebug
      timeout-minutes:
        type: number
        default: 30
      pint:
        type: boolean
        default: true
        description: Run Laravel Pint on the files changed by the PR (requires Pint 1.20+ in require-dev)
      phpstan:
        type: boolean
        default: true
        description: Run PHPStan once, on the highest PHP version of the matrix, when composer.json requires it (phpstan/phpstan or Larastan)
      lint-command:
        type: string
        default: ""
        description: Extra lint command run once after Pint and PHPStan (e.g. composer lint:check), or for js after the typecheck and lint scripts (e.g. npx publint); empty runs none
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  # Fails the run for an unsupported stack; the other jobs check inputs.stack in their condition, so no runner starts
  # just to check it on every event
  stack:
    if: ${{ !contains(fromJSON('["laravel", "js"]'), inputs.stack) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the stack
        shell: bash
        env:
          STACK: ${{ inputs.stack }}
        run: |
          echo "::error::stack '$STACK' is not supported; use laravel or js"
          exit 1

  tests:
    if: inputs.stack == 'laravel' && inputs.tests && contains(fromJSON('["push", "pull_request", "merge_group", "schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
    uses: datalogix/workflows/.github/workflows/laravel-package-tests.yml@v2
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      os: ${{ inputs.os }}
      php: ${{ inputs.php }}
      laravel: ${{ inputs.laravel }}
      stability: ${{ inputs.stability }}
      exclude: ${{ inputs.exclude }}
      extensions: ${{ inputs.extensions }}
      test-command: ${{ inputs.test-command }}
      coverage: ${{ inputs.coverage }}
      coverage-driver: ${{ inputs.coverage-driver }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      pint: ${{ inputs.pint }}
      phpstan: ${{ inputs.phpstan }}
      lint-command: ${{ inputs.lint-command }}

  js-tests:
    # Same name as the Laravel job: the required check is <calling job> / tests / all-checks for every stack
    name: tests
    if: inputs.stack == 'js' && inputs.tests && contains(fromJSON('["push", "pull_request", "merge_group", "schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
    uses: datalogix/workflows/.github/workflows/node-package-tests.yml@v2
    with:
      os: ${{ inputs.os }}
      node: ${{ inputs.node }}
      test-command: ${{ inputs.test-command }}
      lint-command: ${{ inputs.lint-command }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
