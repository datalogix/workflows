name: laravel-app-tests

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: ""
        description: Empty reads .php-version, composer.lock or composer.json config.platform.php, otherwise latest
      node-version:
        type: string
        default: ""
        description: Empty reads .nvmrc or .node-version, otherwise the current LTS
      pint:
        type: boolean
        default: true
        description: Run Laravel Pint on the files changed by the PR (requires Pint 1.20+)
      phpstan:
        type: boolean
        default: true
        description: Run PHPStan when it is installed
      lint-command:
        type: string
        default: ""
        description: Extra lint command run after Pint and PHPStan (e.g. composer lint:check); empty runs none
      audit:
        type: boolean
        default: true
        description: Run composer audit and the Node audit (high and critical) on schedule and manual runs, and on PRs that change their lockfile
      test-command:
        type: string
        default: ""
        description: Empty runs composer test when composer.json defines it, otherwise php artisan test; none skips the test suite
      js:
        type: boolean
        default: true
        description: Run the typecheck, lint and test scripts of package.json when they are defined
      timeout-minutes:
        type: number
        default: 30

jobs:
  tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: ${{ inputs.timeout-minutes }}

    # A new push to a PR cancels the previous run; runs on main always finish
    concurrency:
      # Outside pull requests each run has its own group: one per ref would let a newer pending run replace an older one
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Laravel
        uses: datalogix/workflows/.github/actions/setup-laravel@v2
        with:
          php-version: ${{ inputs.php-version }}
          node-version: ${{ inputs.node-version }}

      # Only the files changed by the PR, so existing style issues do not fail the build
      - name: Laravel Pint
        if: inputs.pint && github.event_name == 'pull_request' && hashFiles('vendor/bin/pint') != ''
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: vendor/bin/pint --test --diff="origin/$BASE"

      - name: PHPStan
        if: inputs.phpstan && hashFiles('vendor/bin/phpstan') != ''
        shell: bash
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=2G

      - name: Lint command
        if: inputs.lint-command != ''
        shell: bash
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
          # Composer stops scripts after 300 seconds by default
          COMPOSER_PROCESS_TIMEOUT: 0
        run: eval "$LINT_COMMAND"

      - name: Tests
        if: inputs.test-command != 'none'
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          # Composer stops scripts after 300 seconds by default
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          if [ -z "$TEST_COMMAND" ]; then
            if jq -e '.scripts.test' composer.json >/dev/null 2>&1; then
              TEST_COMMAND="composer test"
            else
              TEST_COMMAND="php artisan test"
            fi
          fi

          eval "$TEST_COMMAND"

      - name: Detect package.json scripts
        id: js
        if: inputs.js && hashFiles('package.json') != ''
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "run=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "run=yarn run" >> "$GITHUB_OUTPUT"
          else
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          fi

          for script in typecheck lint test; do
            # npm init writes a test script that only fails
            if jq -e --arg script "$script" '.scripts[$script] // "" | select(. != "" and (contains("no test specified") | not))' package.json >/dev/null; then
              echo "$script=true" >> "$GITHUB_OUTPUT"
            else
              echo "No $script script in package.json, skipping"
            fi
          done

      - name: Typecheck
        if: steps.js.outputs.typecheck
        shell: bash
        env:
          RUN: ${{ steps.js.outputs.run }}
        run: $RUN typecheck

      - name: JS lint
        if: steps.js.outputs.lint
        shell: bash
        env:
          RUN: ${{ steps.js.outputs.run }}
        run: $RUN lint

      - name: JS tests
        if: steps.js.outputs.test
        shell: bash
        env:
          RUN: ${{ steps.js.outputs.run }}
        run: $RUN test

      # On PRs only when composer.lock changes, so a new advisory does not block unrelated PRs;
      # scheduled runs catch advisories published after the dependencies were installed
      - name: Composer audit
        if: inputs.audit && hashFiles('composer.lock') != '' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet "origin/$BASE...HEAD" -- composer.lock; then
            echo "composer.lock did not change, skipping"
            exit 0
          fi

          composer audit --locked --abandoned=report --no-interaction

      # Same events as composer audit; fails on high and critical advisories only, as npm reports many low ones.
      # Dev dependencies are included: Vite and the frontend libraries end up in the bundle
      - name: Node audit
        if: inputs.audit && hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock') != '' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            lockfile=pnpm-lock.yaml
          elif [ -f yarn.lock ]; then
            lockfile=yarn.lock
          else
            lockfile=package-lock.json
          fi

          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet "origin/$BASE...HEAD" -- "$lockfile"; then
            echo "$lockfile did not change, skipping"
            exit 0
          fi

          case "$lockfile" in
            pnpm-lock.yaml) pnpm audit --audit-level high ;;
            package-lock.json) npm audit --audit-level=high ;;
            yarn.lock)
              if [ "$(yarn --version | cut -d. -f1)" = 1 ]; then
                # Yarn 1 exits with a bit mask of the severities found: 8 is high, 16 critical
                status=0
                yarn audit --level high || status=$?
                [ "$status" -lt 8 ]
              else
                yarn npm audit --recursive --severity high
              fi
              ;;
          esac
