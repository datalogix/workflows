name: laravel-app-tests

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: ""
        description: Empty reads .php-version, composer.lock or composer.json config.platform.php, otherwise latest
      node-version:
        type: string
        default: ""
        description: Empty reads .nvmrc or .node-version, otherwise the current LTS
      pint:
        type: boolean
        default: true
        description: Run Laravel Pint in test mode when it is installed, on the files changed by the PR (requires Pint 1.20+) or the merge queue group, and on every file on other events
      phpstan:
        type: boolean
        default: true
        description: Run PHPStan when it is installed
      rector:
        type: boolean
        default: true
        description: Run Rector in dry-run mode when it is installed and rector.php exists
      eslint:
        type: boolean
        default: true
        description: Run ESLint, when package.json declares it, it has a config and there is no lint (or check) script
      prettier:
        type: boolean
        default: true
        description: Run Prettier (or the format:check script), when package.json declares it, it has a config and the lint script does not run it
      stylelint:
        type: boolean
        default: true
        description: Run Stylelint (or the lint:css script), when package.json declares it, it has a config and the lint script does not run it
      lint-command:
        type: string
        default: ""
        description: Extra lint command run after Pint, PHPStan and Rector (e.g. composer lint:check); empty runs none
      audit:
        type: boolean
        default: true
        description: Run composer audit and the Node audit (high and critical) on schedule and manual runs, and on PRs that change their lockfile
      test-command:
        type: string
        default: ""
        description: Empty runs composer test when composer.json defines it, otherwise php artisan test with artisan, php bin/phpunit with bin/phpunit, vendor/bin/pest with Pest, else vendor/bin/phpunit; none skips the test suite
      min-coverage:
        type: number
        default: 0
        description: Minimum coverage of the PHP test suite, in percent of statements, methods and conditionals, read from the Clover report it writes (with pcov); the coverage is shown in the job summary, and 0 (the default) never fails
      js:
        type: boolean
        default: true
        description: Run the typecheck (or types:check, type-check), lint (or check) and test scripts of package.json when they are defined, and ESLint, Prettier and Stylelint when package.json declares them, they have a config and no script runs them
      timeout-minutes:
        type: number
        default: 30
      database:
        type: string
        default: none
        description: Database server for the tests of a Symfony app with Doctrine (stack php); postgres, mysql or mariadb starts it as a service and points DATABASE_URL at it; none (the default) uses the database of .env.test

jobs:
  tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: ${{ inputs.timeout-minutes }}

    # A new push to a PR cancels the previous run; runs on main always finish
    concurrency:
      # Outside pull requests each run has its own group: one per ref would let a newer pending run replace an older one
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    # The database server of the database input; an empty image starts no service. The credentials are those of the
    # DATABASE_URL below, root for MySQL and MariaDB so Doctrine can create the _test database of Symfony's test env
    services:
      database:
        image: ${{ inputs.database == 'postgres' && 'postgres:17' || inputs.database == 'mysql' && 'mysql:8.4' || inputs.database == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app
        ports:
          - 5432:5432
          - 3306:3306
        options: >-
          ${{ inputs.database == 'postgres' && '--health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20' || inputs.database == 'mariadb' && '--health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20' || '--health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-timeout 5s --health-retries 20' }}

    steps:
      # Before setup-laravel, which migrates the test database. A real environment variable wins over Symfony's .env
      # files; none sets nothing, so .env.test decides
      - name: Point DATABASE_URL at the database service
        if: inputs.database != 'none'
        shell: bash
        env:
          DATABASE: ${{ inputs.database }}
        run: |
          case "$DATABASE" in
            postgres) url='postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8' ;;
            mysql) url='mysql://root:root@127.0.0.1:3306/app?serverVersion=8.4.0&charset=utf8mb4' ;;
            mariadb) url='mysql://root:root@127.0.0.1:3306/app?serverVersion=11.4.0-MariaDB&charset=utf8mb4' ;;
            *)
              echo "::error::database '$DATABASE' is not supported; use postgres, mysql, mariadb or none"
              exit 1
              ;;
          esac
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Pint and the JS style check compare with the base of the pull request or the merge queue group, and
          # the audits with the base of the pull request, which needs the history; on other events they check every
          # file. 0 is falsy in expressions, so it goes last
          fetch-depth: ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && 1 || 0 }}

      # Each check below runs even when an earlier one failed, so a run reports every failure at once; none runs
      # without the dependencies
      - name: Setup Laravel
        id: setup
        uses: datalogix/workflows/.github/actions/setup-laravel@v2
        with:
          php-version: ${{ inputs.php-version }}
          node-version: ${{ inputs.node-version }}
          # PHPUnit collects coverage only when phpunit.xml or the test command asks for a report
          coverage: ${{ inputs.test-command != 'none' && 'pcov' || 'none' }}

      # On a pull request only the files it changes, so existing style issues do not block it, and in the merge queue
      # only those of the group, so they do not block the queue; every file on other events. Blade views too when the
      # project declares prettier-plugin-blade (Pint formats them with Prettier from node_modules, and stops when it is
      # missing) and Pint has --blade (1.30+)
      - name: Laravel Pint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.pint && hashFiles('vendor/bin/pint') != '' }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          args=(--test)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            args+=(--diff="origin/$BASE")
          elif [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            args+=(--diff="$MERGE_GROUP_BASE")
          fi
          if [ -f package.json ] \
            && jq -e '(.devDependencies // {}) + (.dependencies // {}) | has("prettier-plugin-blade")' package.json >/dev/null \
            && grep -q -- '--blade' <<< "$(vendor/bin/pint --help)"; then
            args+=(--blade)
          fi
          vendor/bin/pint "${args[@]}"

      # PHPStan's default tmpDir; a project that sets another one just runs without the result cache. One cache per pull
      # request, saved by its first run (later runs start from it), and one per commit elsewhere, which a new pull
      # request starts from
      - name: Restore PHPStan cache
        id: phpstan-cache
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.phpstan && hashFiles('vendor/bin/phpstan') != '' }}
        uses: actions/cache/restore@v6
        with:
          path: /tmp/phpstan
          key: phpstan-${{ runner.os }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          restore-keys: phpstan-${{ runner.os }}-

      - name: PHPStan
        id: phpstan
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.phpstan && hashFiles('vendor/bin/phpstan') != '' }}
        shell: bash
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=2G

      # Also after errors: the result cache still holds every file analysed. Not in the merge queue, whose temporary
      # branches no other run can read
      - name: Save PHPStan cache
        if: ${{ !cancelled() && github.event_name != 'merge_group' && steps.phpstan-cache.outputs.cache-hit != 'true' && (steps.phpstan.outcome == 'success' || steps.phpstan.outcome == 'failure') }}
        uses: actions/cache/save@v6
        with:
          path: /tmp/phpstan
          key: phpstan-${{ runner.os }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}

      # Checks only: the changes Rector would make fail the step, and are applied locally (vendor/bin/rector)
      - name: Rector
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.rector && hashFiles('vendor/bin/rector') != '' && hashFiles('rector.php') != '' }}
        shell: bash
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Lint command
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.lint-command != '' }}
        shell: bash
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
          # Composer stops scripts after 300 seconds by default
          COMPOSER_PROCESS_TIMEOUT: 0
        run: eval "$LINT_COMMAND"

      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.test-command != 'none' }}
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          # Composer stops scripts after 300 seconds by default
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          # A PHP app without Laravel (stack php) has no artisan: Symfony's recipe writes bin/phpunit
          if [ -z "$TEST_COMMAND" ]; then
            if jq -e '.scripts.test' composer.json >/dev/null 2>&1; then
              TEST_COMMAND="composer test"
            elif [ -f artisan ]; then
              TEST_COMMAND="php artisan test"
            elif [ -f bin/phpunit ]; then
              TEST_COMMAND="php bin/phpunit"
            elif [ -f vendor/bin/pest ]; then
              TEST_COMMAND="vendor/bin/pest"
            else
              TEST_COMMAND="vendor/bin/phpunit"
            fi
          fi

          # The coverage check ignores a report older than this
          touch "$RUNNER_TEMP/tests-started"
          eval "$TEST_COMMAND"

      # Shown in the job summary; fails only below min-coverage
      - name: Coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: datalogix/workflows/.github/actions/coverage@v2
        with:
          min-coverage: ${{ inputs.min-coverage }}
          since: ${{ runner.temp }}/tests-started

      - name: Detect package.json scripts
        id: js
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.js && hashFiles('package.json') != '' }}
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "run=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "run=yarn run" >> "$GITHUB_OUTPUT"
          else
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          fi

          # The first of the names that package.json defines (npm init writes a test script that only fails)
          first() {
            for script in "$@"; do
              if jq -e --arg script "$script" '.scripts[$script] // "" | select(. != "" and (contains("no test specified") | not))' package.json >/dev/null; then
                echo "$script"
                return
              fi
            done
            echo "No $1 script in package.json, skipping" >&2
          }

          # types:check is the name in the Laravel starter kits, type-check create-vue's; check is Vite+'s (vp check),
          # the starter kits' lint
          {
            echo "typecheck=$(first typecheck types:check type-check)"
            echo "lint=$(first lint check)"
            echo "test=$(first test)"
          } >> "$GITHUB_OUTPUT"

      # The typecheck and lint scripts must check, not fix: the step after them fails when they changed a tracked file
      - name: Snapshot the working tree
        id: snapshot
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.js.outcome == 'success' }}
        shell: bash
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
        # A commit of the tracked files as the earlier steps left them (HEAD when they changed none), without touching
        # them
        run: |
          snapshot=$(git stash create)
          echo "ref=${snapshot:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.js.outputs.typecheck }}
        shell: bash
        env:
          RUN: ${{ steps.js.outputs.run }}
          SCRIPT: ${{ steps.js.outputs.typecheck }}
        run: $RUN "$SCRIPT"

      - name: JS lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.js.outputs.lint }}
        shell: bash
        env:
          RUN: ${{ steps.js.outputs.run }}
          SCRIPT: ${{ steps.js.outputs.lint }}
        run: $RUN "$SCRIPT"

      # ESLint, Prettier and Stylelint, each one the lint script does not run already: on the files the pull request or
      # the merge queue group changes, on every tracked file on other events
      - name: JS style
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.js.outcome == 'success' }}
        uses: datalogix/workflows/.github/actions/js-lint@v2
        with:
          eslint: ${{ inputs.eslint }}
          prettier: ${{ inputs.prettier }}
          stylelint: ${{ inputs.stylelint }}

      - name: Check that lint changed no files
        if: ${{ !cancelled() && steps.snapshot.outputs.ref }}
        shell: bash
        env:
          SNAPSHOT: ${{ steps.snapshot.outputs.ref }}
        run: |
          if ! git diff --quiet "$SNAPSHOT"; then
            echo "::error::The typecheck or lint script changed tracked files: it must check, not fix (e.g. eslint . instead of eslint . --fix, prettier --check instead of prettier --write)"
            git diff --stat "$SNAPSHOT"
            exit 1
          fi

      - name: JS tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.js.outputs.test }}
        shell: bash
        env:
          RUN: ${{ steps.js.outputs.run }}
        run: $RUN test

      # On PRs only when composer.lock changes, so a new advisory does not block unrelated PRs;
      # scheduled runs catch advisories published after the dependencies were installed
      - name: Composer audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.audit && hashFiles('composer.lock') != '' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # git diff exits with 1 when the file changed; anything else is an error, not a reason to audit
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            status=0
            git diff --quiet "origin/$BASE...HEAD" -- composer.lock || status=$?
            if [ "$status" = 0 ]; then
              echo "composer.lock did not change, skipping"
              exit 0
            elif [ "$status" != 1 ]; then
              echo "::error::Could not compare composer.lock with origin/$BASE"
              exit 1
            fi
          fi

          composer audit --locked --abandoned=report --no-interaction

      # Same events as composer audit; fails on high and critical advisories only, as npm reports many low ones.
      # Dev dependencies are included: Vite and the frontend libraries end up in the bundle
      - name: Node audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.audit && hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock') != '' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            lockfile=pnpm-lock.yaml
          elif [ -f yarn.lock ]; then
            lockfile=yarn.lock
          else
            lockfile=package-lock.json
          fi

          # As in composer audit
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            status=0
            git diff --quiet "origin/$BASE...HEAD" -- "$lockfile" || status=$?
            if [ "$status" = 0 ]; then
              echo "$lockfile did not change, skipping"
              exit 0
            elif [ "$status" != 1 ]; then
              echo "::error::Could not compare $lockfile with origin/$BASE"
              exit 1
            fi
          fi

          case "$lockfile" in
            pnpm-lock.yaml) pnpm audit --audit-level high ;;
            package-lock.json) npm audit --audit-level=high ;;
            yarn.lock)
              if [ "$(yarn --version | cut -d. -f1)" = 1 ]; then
                # Yarn 1 exits with a bit mask of the severities found (8 is high, 16 critical), and with 1 also when
                # the registry cannot be reached: only a report with its summary counts as an audit. Only its lines that
                # are JSON objects are read: a plain-text line (a banner, a warning) is not part of the report
                report="$RUNNER_TEMP/yarn-audit.json"
                status=0
                yarn audit --level high --json > "$report" || status=$?
                if ! jq -e -n -R 'any(inputs | fromjson? | objects; .type == "auditSummary")' "$report" > /dev/null 2>&1; then
                  echo "::error::yarn audit did not finish (exit code $status)"
                  exit 1
                fi
                jq -r -R 'fromjson? | objects | select(.type == "auditAdvisory") | .data.advisory | "\(.severity): \(.module_name) \(.title) (\(.url))"' "$report"
                [ "$status" -lt 8 ]
              else
                yarn npm audit --recursive --severity high
              fi
              ;;
          esac
