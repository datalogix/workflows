name: claude-review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: opus
        description: Claude model (e.g. fable, opus, sonnet); empty uses the account default
      timeout-minutes:
        type: number
        default: 30
      ignored-authors:
        type: string
        default: '["dependabot[bot]", "renovate[bot]"]'
        description: JSON list of PR authors that are not reviewed
      skip-label:
        type: string
        default: no-review
        description: PRs with this label are not reviewed
      allowed-bots:
        type: string
        default: "*"
        description: Bots whose PRs are reviewed (ignored-authors still takes precedence)
      plugin-marketplaces:
        type: string
        default: https://github.com/datalogix/workflows.git
        description: Extra marketplaces, besides the one with the code-review plugin
      plugins:
        type: string
        default: laravel@datalogix
        description: Extra plugins, besides code-review
      extra-instructions:
        type: string
        default: ""
        description: Extra instructions for this repository (no double quotes)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON(inputs.ignored-authors), github.event.pull_request.user.login) &&
      !contains(github.event.pull_request.labels.*.name, inputs.skip-label)

    runs-on: ubuntu-latest

    timeout-minutes: ${{ inputs.timeout-minutes }}

    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed-bots }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            ${{ inputs.plugin-marketplaces }}
          plugins: |
            code-review@claude-code-plugins
            ${{ inputs.plugins }}
          prompt: /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: |
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            --append-system-prompt "Before starting, load the laravel:conventions skill and follow its language rules: write every review comment in Brazilian Portuguese. ${{ inputs.extra-instructions }}"
