name: claude-review

on:
  workflow_call:
    inputs:
      stack:
        type: string
        default: laravel
        description: Stack of the project (laravel, php or js), which picks the environment prepared for Claude and the commands and conventions skill of its plugin (<stack>@datalogix, listed in plugins)
      model:
        type: string
        default: opus
        description: Claude model (e.g. fable, opus, sonnet); empty uses the account default
      max-turns:
        type: number
        default: 80
        description: Maximum turns of Claude's review; a review that reaches it fails and says so on the pull request
      timeout-minutes:
        type: number
        default: 30
        description: Timeout of Claude's review step; a review that reaches it fails and says so on the pull request
      ignored-authors:
        type: string
        default: '["dependabot[bot]", "renovate[bot]"]'
        description: JSON list of PR authors that are not reviewed, unless someone else pushed the commits
      skip-label:
        type: string
        default: no-review
        description: PRs with this label are not reviewed
      allowed-bots:
        type: string
        default: "*"
        description: Bots whose PRs are reviewed (ignored-authors still takes precedence)
      plugin-marketplaces:
        type: string
        default: ""
        description: Extra marketplaces, one per line, besides the one with the code-review plugin and this repository's (at the same version as the workflows)
      code-review-ref:
        type: string
        default: ""
        description: Commit, tag or branch of anthropics/claude-code to install the code-review plugin from; empty uses the latest
      plugins:
        type: string
        default: ""
        description: Extra Claude Code plugins, one per line (name@marketplace), besides core@datalogix, ci@datalogix and the stack's, always installed, and code-review
      extra-instructions:
        type: string
        default: ""
        description: Extra instructions for this repository (no double quotes)
      language:
        type: string
        default: pt-BR
        description: Language of what Claude writes for the team (e.g. pt-BR, en; no double quotes)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(contains(fromJSON(inputs.ignored-authors), github.event.pull_request.user.login) &&
        contains(fromJSON(inputs.ignored-authors), github.actor)) &&
      !contains(github.event.pull_request.labels.*.name, inputs.skip-label)

    runs-on: ubuntu-latest

    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Locate the Datalogix plugins
        id: plugins
        uses: datalogix/workflows/.github/actions/plugins@v2
        with:
          stack: ${{ inputs.stack }}
          plugins: ${{ inputs.plugins }}

      # A pull request that changes the workflow file cannot run Claude: the job only warns (it has no permission to
      # comment), and the security review's comment explains it on the pull request
      - name: Check the workflow file
        id: workflow
        uses: datalogix/workflows/.github/actions/workflow-file@v2

      # Empty uses the marketplace's latest version; a ref fetches that version into a local marketplace
      - name: Locate the code-review plugin
        id: code-review
        if: steps.workflow.outputs.changed != 'true'
        env:
          REF: ${{ inputs.code-review-ref }}
        run: |
          url=https://github.com/anthropics/claude-code.git
          if [ -z "$REF" ]; then
            echo "marketplace=$url" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/claude-code"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$url" "$REF"
          git -C "$dir" checkout -q FETCH_HEAD
          echo "marketplace=$dir" >> "$GITHUB_OUTPUT"

      # The timeout is the step's, not the job's: a job that times out is cancelled, like one a newer run replaces, and
      # only a failure makes the warn job comment
      - name: Run Claude Code Review
        if: steps.workflow.outputs.changed != 'true'
        timeout-minutes: ${{ inputs.timeout-minutes }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed-bots }}
          plugin_marketplaces: |
            ${{ steps.code-review.outputs.marketplace }}
            ${{ steps.plugins.outputs.marketplace }}
            ${{ inputs.plugin-marketplaces }}
          plugins: |
            code-review@claude-code-plugins
            ${{ steps.plugins.outputs.plugins }}
          prompt: /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: |
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            --max-turns ${{ inputs.max-turns }}
            --append-system-prompt "Before starting, load the core:conventions skill and follow its language rules: write every review comment in the team language. Team language: ${{ inputs.language }}. ${{ inputs.extra-instructions }}"

  # A review that fails (max-turns, the timeout, an error of the action) may leave the pull request with part of its
  # comments or none: say so there. Not when the review is cancelled, since a newer run replaces it. A job of its own so
  # the review keeps read-only permissions
  warn:
    needs: review
    if: always() && needs.review.result == 'failure'

    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Datalogix language
        id: language
        uses: datalogix/workflows/.github/actions/language@v2
        with:
          language: ${{ inputs.language }}

      - name: Comment on the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ENGLISH: ${{ steps.language.outputs.english }}
        run: |
          if [ "$ENGLISH" = true ]; then
            body="Claude's review did not finish (turn limit, timeout or an error), so this pull request may have only part of its comments, or none. See [the run]($RUN_URL); re-run the failed jobs or comment \`@claude\` asking for another review."
          else
            body="A review do Claude não terminou (limite de turnos, tempo ou um erro), então este pull request pode ter só parte dos comentários, ou nenhum. Veja [a execução]($RUN_URL); execute de novo os jobs que falharam ou comente \`@claude\` pedindo outra review."
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
