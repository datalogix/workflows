name: node-app-tests

# Tests of a JavaScript or TypeScript app (Next, Nuxt), called by project.yml with stack: js. The package.json scripts are
# the checks, on the Node version of .nvmrc or .node-version: typecheck, lint, test, build, then test:e2e against that
# build, and the audit. A single job, so the required check stays <calling job> / tests / tests.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: ""
        description: Node version (empty reads .nvmrc or .node-version, otherwise the current LTS)
      test-command:
        type: string
        default: ""
        description: Empty runs the test script of package.json when it has one; none skips the unit tests
      lint-command:
        type: string
        default: ""
        description: Extra lint command run after the typecheck and lint scripts; empty runs none
      e2e:
        type: boolean
        default: true
        description: Run the test:e2e script of package.json when it has one, after the build (with Playwright's browsers when the project uses Playwright)
      audit:
        type: boolean
        default: true
        description: Audit the dependencies (high and critical advisories) on pull requests that change the lockfile, and on scheduled and manual runs
      timeout-minutes:
        type: number
        default: 30

jobs:
  tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: ${{ inputs.timeout-minutes }}

    # A new push to a PR cancels the previous run; runs on main always finish
    concurrency:
      # Outside pull requests each run has its own group: one per ref would let a newer pending run replace an older one
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Each check below runs even when an earlier one failed, so a run reports every failure at once; none runs
      # without the dependencies
      - name: Setup JavaScript
        id: setup
        uses: datalogix/workflows/.github/actions/setup-js@v2
        with:
          node-version: ${{ inputs.node-version }}

      - name: Detect package.json scripts
        id: scripts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          for script in typecheck lint build test:e2e; do
            if jq -e --arg script "$script" '.scripts[$script] // "" | select(. != "")' package.json >/dev/null; then
              echo "${script/:/-}=true" >> "$GITHUB_OUTPUT"
            else
              echo "No $script script in package.json, skipping"
            fi
          done
          # npm init writes a test script that only fails
          if jq -e '.scripts.test // "" | select(. != "" and (contains("no test specified") | not))' package.json >/dev/null; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          fi
          if jq -e '(.dependencies // {}) + (.devDependencies // {}) | has("@playwright/test") or has("playwright")' package.json >/dev/null; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.scripts.outputs.typecheck }}
        shell: bash
        env:
          RUN: ${{ steps.setup.outputs.run }}
        run: $RUN typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.scripts.outputs.lint }}
        shell: bash
        env:
          RUN: ${{ steps.setup.outputs.run }}
        run: $RUN lint

      - name: Lint command
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.lint-command != '' }}
        shell: bash
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: eval "$LINT_COMMAND"

      - name: Tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.test-command != 'none' && (inputs.test-command != '' || steps.scripts.outputs.test) }}
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          RUN: ${{ steps.setup.outputs.run }}
        run: |
          if [ -n "$TEST_COMMAND" ]; then
            eval "$TEST_COMMAND"
          else
            $RUN test
          fi

      # Next and Nuxt report rendering and route errors only when they build
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.scripts.outputs.build }}
        shell: bash
        env:
          RUN: ${{ steps.setup.outputs.run }}
        run: $RUN build

      - name: Install Playwright's browsers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.e2e && steps.scripts.outputs.test-e2e && steps.scripts.outputs.playwright && steps.build.outcome != 'failure' }}
        shell: bash
        run: npx --no-install playwright install --with-deps

      # Against the build: an app that does not build has nothing to test end to end
      - name: End-to-end tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.e2e && steps.scripts.outputs.test-e2e && steps.build.outcome != 'failure' }}
        shell: bash
        env:
          RUN: ${{ steps.setup.outputs.run }}
          CI: "true"
        run: $RUN test:e2e

      # On PRs only when the lockfile changes, so a new advisory does not block unrelated PRs; scheduled runs catch
      # advisories published after the dependencies were installed. Fails on high and critical advisories only, as
      # npm reports many low ones
      - name: Audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.audit && steps.setup.outputs.lockfile != '' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          LOCKFILE: ${{ steps.setup.outputs.lockfile }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet "origin/$BASE...HEAD" -- "$LOCKFILE"; then
            echo "$LOCKFILE did not change, skipping"
            exit 0
          fi

          case "$LOCKFILE" in
            pnpm-lock.yaml) pnpm audit --audit-level high ;;
            package-lock.json) npm audit --audit-level=high ;;
            yarn.lock)
              if [ "$(yarn --version | cut -d. -f1)" = 1 ]; then
                # Yarn 1 exits with a bit mask of the severities found: 8 is high, 16 critical
                status=0
                yarn audit --level high || status=$?
                [ "$status" -lt 8 ]
              else
                yarn npm audit --recursive --severity high
              fi
              ;;
          esac
