name: laravel-package-tests

on:
  workflow_call:
    inputs:
      os:
        type: string
        default: '["ubuntu-latest"]'
      php:
        type: string
        default: '["8.2", "8.3", "8.4", "8.5"]'
      laravel:
        type: string
        default: '["^12.0", "^13.0"]'
        description: Laravel versions of the matrix; '[""]' installs no framework, for a PHP package without Laravel (package.yml passes it with stack php)
      stability:
        type: string
        default: '["prefer-lowest", "prefer-stable"]'
      exclude:
        type: string
        default: |
          [
            {"laravel": "^13.0", "php": "8.2"},
            {"stability": "prefer-lowest", "php": "8.4"},
            {"stability": "prefer-lowest", "php": "8.5"}
          ]
      extensions:
        type: string
        default: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
      test-command:
        type: string
        default: ""
        description: Empty runs composer test when composer.json defines it, otherwise vendor/bin/pest when Pest is installed, otherwise vendor/bin/phpunit; none skips the test suite
      coverage:
        type: boolean
        default: true
        description: Upload coverage to Codecov from the newest combination of the matrix (highest PHP and Laravel, prefer-stable, first OS)
      min-coverage:
        type: number
        default: 100
        description: Minimum coverage on the newest combination of the matrix, in percent of statements, methods and conditionals, read from the Clover report the tests write; 0 checks nothing
      coverage-driver:
        type: string
        default: pcov
        description: pcov (faster) or xdebug
      timeout-minutes:
        type: number
        default: 30
      pint:
        type: boolean
        default: true
        description: Run Laravel Pint on the files changed by the PR (requires Pint 1.20+ in require-dev)
      phpstan:
        type: boolean
        default: true
        description: Run PHPStan once, on the highest PHP version of the matrix, when composer.json requires it (phpstan/phpstan or Larastan)
      rector:
        type: boolean
        default: true
        description: Run Rector in dry-run mode once, on the highest PHP version of the matrix, when composer.json requires rector/rector and rector.php exists
      api-check:
        type: boolean
        default: false
        description: On pull requests, fail when the change breaks the public API of the package compared with the base branch (roave/backward-compatibility-check)
      lint-command:
        type: string
        default: ""
        description: Extra lint command run once after Pint, PHPStan and Rector (e.g. composer lint:check); empty runs none
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  tests:
    if: inputs.test-command != 'none'

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    timeout-minutes: ${{ inputs.timeout-minutes }}

    # A new push to a PR cancels the previous run; runs on main always finish
    concurrency:
      # Outside pull requests each run has its own group: one per ref would let a newer pending run replace an older one
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        php: ${{ fromJSON(inputs.php) }}
        laravel: ${{ fromJSON(inputs.laravel) }}
        stability: ${{ fromJSON(inputs.stability) }}
        exclude: ${{ fromJSON(inputs.exclude) }}

    name: P${{ matrix.php }}${{ matrix.laravel && format(' - L{0}', matrix.laravel) || '' }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The coverage driver slows the tests down and Codecov merges every upload into the same report,
      # so coverage is collected (uploaded and checked) only once, on the newest combination of the matrix
      - name: Check coverage
        id: coverage
        if: inputs.coverage || inputs.min-coverage != 0
        shell: bash
        env:
          OS: ${{ inputs.os }}
          PHP: ${{ inputs.php }}
          LARAVEL: ${{ inputs.laravel }}
          STABILITY: ${{ inputs.stability }}
          EXCLUDE: ${{ inputs.exclude }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PHP: ${{ matrix.php }}
          MATRIX_LARAVEL: ${{ matrix.laravel }}
          MATRIX_STABILITY: ${{ matrix.stability }}
        run: |
          newest='map(tostring) | max_by(gsub("[^0-9.]"; "") | split(".") | map(select(. != "") | tonumber))'
          os=$(jq -r 'first' <<< "$OS")
          php=$(jq -r "$newest" <<< "$PHP")
          laravel=$(jq -r "$newest" <<< "$LARAVEL")
          stability=$(jq -r 'if index("prefer-stable") then "prefer-stable" else last end' <<< "$STABILITY")

          # Without the Laravel axis (laravel: '[""]') the messages leave Laravel out
          named="PHP $php${laravel:+, Laravel $laravel}, $stability, $os"

          # An exclude entry matching the newest combination would leave no job collecting coverage
          combination=$(jq -n --arg os "$os" --arg php "$php" --arg laravel "$laravel" --arg stability "$stability" '$ARGS.named')
          if jq -e --argjson c "$combination" 'any(.[]; to_entries | all((.value | tostring) == $c[.key]))' <<< "$EXCLUDE" >/dev/null; then
            echo "::warning::exclude removes $named, the combination that collects coverage: coverage is neither reported nor checked"
          fi

          if [ "$MATRIX_OS" = "$os" ] && [ "$MATRIX_PHP" = "$php" ] && [ "$MATRIX_LARAVEL" = "$laravel" ] && [ "$MATRIX_STABILITY" = "$stability" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Coverage is collected on $named"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.extensions }}
          coverage: ${{ steps.coverage.outputs.enabled && inputs.coverage-driver || 'none' }}

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Install dependencies
        shell: bash
        env:
          LARAVEL: ${{ matrix.laravel }}
          STABILITY: ${{ matrix.stability }}
        run: |
          # Empty without the Laravel axis: a PHP package installs its own requirements only
          if [ -n "$LARAVEL" ]; then
            composer require "laravel/framework:$LARAVEL" --no-interaction --no-update
          fi
          composer update "--$STABILITY" --prefer-dist --no-interaction

      - name: Execute tests
        id: tests
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          COVERAGE: ${{ steps.coverage.outputs.enabled }}
          # Composer stops scripts after 300 seconds by default
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          # Pest depends on PHPUnit, so it is checked first
          if [ -z "$TEST_COMMAND" ]; then
            script=$(jq -r '.scripts.test // empty | if type == "string" then . else "multiple commands" end' composer.json)
            if [ -n "$script" ]; then
              TEST_COMMAND="composer test"
            elif [ -x vendor/bin/pest ]; then
              TEST_COMMAND=vendor/bin/pest
            elif [ -x vendor/bin/phpunit ]; then
              TEST_COMMAND=vendor/bin/phpunit
            else
              echo "::error::Neither Pest nor PHPUnit is installed; set the test-command input"
              exit 1
            fi
          fi

          # Without a driver, a coverage report requested in phpunit.xml produces a warning, which fails the run with failOnWarning
          if [ "$COVERAGE" != true ]; then
            if [[ "$TEST_COMMAND" =~ ^vendor/bin/(phpunit|pest)([[:space:]]|$) ]]; then
              TEST_COMMAND="$TEST_COMMAND --no-coverage"
            # Composer passes the arguments after -- to the script's command, so only a single PHPUnit or Pest command takes it
            elif [ "$TEST_COMMAND" = "composer test" ] && [[ "$script" =~ ^(@php[[:space:]]+)?(vendor/bin/)?(phpunit|pest)([[:space:]]|$) ]]; then
              TEST_COMMAND="composer test -- --no-coverage"
            fi
          fi

          # The coverage check ignores a report older than this
          touch "$RUNNER_TEMP/tests-started"
          eval "$TEST_COMMAND"

      - name: Coverage
        if: steps.coverage.outputs.enabled && inputs.coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Minimum coverage
        if: steps.coverage.outputs.enabled && inputs.min-coverage != 0
        uses: datalogix/workflows/.github/actions/coverage@v2
        with:
          min-coverage: ${{ inputs.min-coverage }}
          since: ${{ runner.temp }}/tests-started

  # Lint does not depend on the matrix, so it runs once, next to the tests
  lint:
    if: (inputs.pint && github.event_name == 'pull_request') || inputs.phpstan || inputs.rector || inputs.lint-command != '' || (inputs.api-check && github.event_name == 'pull_request')

    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: ${{ inputs.timeout-minutes }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-lint
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Pint compares with the base branch, which needs the history; it only runs on pull requests. 0 is falsy in
          # expressions, so it goes last
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Check for lint tools
        id: lint
        shell: bash
        env:
          PHP: ${{ inputs.php }}
          PINT: ${{ inputs.pint && github.event_name == 'pull_request' }}
          PHPSTAN: ${{ inputs.phpstan }}
          RECTOR: ${{ inputs.rector }}
          LINT_COMMAND: ${{ inputs.lint-command }}
          API_CHECK: ${{ inputs.api-check && github.event_name == 'pull_request' }}
        run: |
          requires() {
            jq -e --arg name "$1" '(.["require-dev"] // {}) + (.require // {}) | has($name)' composer.json >/dev/null
          }

          enabled=
          if [ "$PINT" = true ]; then
            if requires laravel/pint; then
              echo "pint=true" >> "$GITHUB_OUTPUT"
              enabled=true
              # Pint formats Blade views with Prettier from node_modules, and stops when it is missing
              if [ -f package.json ] \
                && jq -e '(.devDependencies // {}) + (.dependencies // {}) | has("prettier-plugin-blade")' package.json >/dev/null; then
                echo "blade=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "laravel/pint is not required by composer.json, skipping Pint"
            fi
          fi
          if [ "$PHPSTAN" = true ]; then
            if requires phpstan/phpstan || requires larastan/larastan || requires nunomaduro/larastan; then
              echo "phpstan=true" >> "$GITHUB_OUTPUT"
              enabled=true
            else
              echo "PHPStan is not required by composer.json, skipping PHPStan"
            fi
          fi
          if [ "$RECTOR" = true ]; then
            if requires rector/rector && [ -f rector.php ]; then
              echo "rector=true" >> "$GITHUB_OUTPUT"
              enabled=true
            else
              echo "Rector is not required by composer.json or rector.php is missing, skipping Rector"
            fi
          fi
          [ -n "$LINT_COMMAND" ] && enabled=true
          # The public API check needs PHP and the dependencies too, even without a lint tool
          [ "$API_CHECK" = true ] && enabled=true

          if [ -n "$enabled" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            # Highest PHP version of the matrix, which the package is known to support (given as strings or numbers)
            newest='map(tostring) | max_by(gsub("[^0-9.]"; "") | split(".") | map(select(. != "") | tonumber))'
            echo "php=$(jq -r "$newest" <<< "$PHP")" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.lint.outputs.enabled
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.lint.outputs.php }}
          extensions: ${{ inputs.extensions }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        if: steps.lint.outputs.enabled
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        if: steps.lint.outputs.enabled
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-lint-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-lint-${{ runner.os }}-

      # Each tool below runs even when an earlier one failed, so a run reports every failure at once
      - name: Install dependencies
        id: install
        if: steps.lint.outputs.enabled
        shell: bash
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # Only for Pint to format Blade views
      - name: Setup JavaScript
        id: js
        if: steps.lint.outputs.blade
        uses: datalogix/workflows/.github/actions/setup-js@v2

      # Only the files changed by the PR, so existing style issues do not fail the build. Blade views too when the
      # package declares prettier-plugin-blade and Pint has --blade (1.30+)
      - name: Laravel Pint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.lint.outputs.pint && (!steps.lint.outputs.blade || steps.js.outcome == 'success') }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          BLADE: ${{ steps.lint.outputs.blade }}
        run: |
          args=(--test --diff="origin/$BASE")
          if [ "$BLADE" = true ] && grep -q -- '--blade' <<< "$(vendor/bin/pint --help)"; then
            args+=(--blade)
          fi
          vendor/bin/pint "${args[@]}"

      # PHPStan's default tmpDir; a package that sets another one just runs without the result cache. One cache per pull
      # request, saved by its first run (later runs start from it), and one per commit elsewhere, which a new pull
      # request starts from
      - name: Restore PHPStan cache
        id: phpstan-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.lint.outputs.phpstan }}
        uses: actions/cache/restore@v6
        with:
          path: /tmp/phpstan
          key: phpstan-${{ runner.os }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          restore-keys: phpstan-${{ runner.os }}-

      - name: PHPStan
        id: phpstan
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.lint.outputs.phpstan }}
        shell: bash
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=2G

      # Also after errors: the result cache still holds every file analysed. Not in the merge queue, whose temporary
      # branches no other run can read
      - name: Save PHPStan cache
        if: ${{ !cancelled() && github.event_name != 'merge_group' && steps.phpstan-cache.outputs.cache-hit != 'true' && (steps.phpstan.outcome == 'success' || steps.phpstan.outcome == 'failure') }}
        uses: actions/cache/save@v6
        with:
          path: /tmp/phpstan
          key: phpstan-${{ runner.os }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}

      # Checks only: the changes Rector would make fail the step, and are applied locally (vendor/bin/rector)
      - name: Rector
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.lint.outputs.rector }}
        shell: bash
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Lint command
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.lint-command != '' }}
        shell: bash
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
          # Composer stops scripts after 300 seconds by default
          COMPOSER_PROCESS_TIMEOUT: 0
        run: eval "$LINT_COMMAND"

      # Against the base branch of the pull request, which the checkout fetched with the history. The tool goes to
      # Composer's global folder, so it neither changes nor conflicts with the package's dependencies
      - name: Public API compatibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.api-check && github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          composer global require roave/backward-compatibility-check --no-interaction --quiet
          "$(composer global config bin-dir --absolute --quiet)/roave-backward-compatibility-check" \
            --from="origin/$BASE" --format=github-actions

  # Single status check for branch protection and merge queues, so it does not depend on the matrix job names
  all-checks:
    if: always()

    needs: [tests, lint]

    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Check results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            # tests is skipped with test-command none, lint when it has nothing to run
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
