name: claude-fix-ci

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: ""
        description: Empty reads .php-version, composer.lock or composer.json config.platform.php, otherwise latest
      node-version:
        type: string
        default: ""
        description: Empty reads .nvmrc or .node-version, otherwise the current LTS
      model:
        type: string
        default: sonnet
        description: Claude model (e.g. fable, opus, sonnet); empty uses the account default
      max-turns:
        type: number
        default: 60
      timeout-minutes:
        type: number
        default: 45
      max-attempts:
        type: number
        default: 2
        description: Maximum number of automatic fix commits per PR
      branch-prefix:
        type: string
        default: claude/
        description: Only fix PRs from branches with this prefix
      allowed-tools:
        type: string
        default: Read,Write,Edit,MultiEdit,Grep,Glob,Bash(*),mcp__laravel-boost__*
      disallowed-tools:
        type: string
        default: Bash(git push --force:*),Bash(git push -f:*),Bash(git push --delete:*),Bash(gh pr merge:*),Bash(gh release:*),Bash(gh repo:*),Bash(gh secret:*)
      plugin-marketplaces:
        type: string
        default: https://github.com/datalogix/workflows.git
      plugins:
        type: string
        default: laravel@datalogix
      extra-instructions:
        type: string
        default: ""
        description: Extra instructions for this repository (no double quotes)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number &&
      startsWith(github.event.workflow_run.head_branch, inputs.branch-prefix)

    runs-on: ubuntu-latest

    timeout-minutes: ${{ inputs.timeout-minutes }}

    concurrency:
      group: claude-fix-ci-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true

    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Check whether to run
        id: check
        shell: bash
        env:
          BASE: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          MAX: ${{ inputs.max-attempts }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$FAILED_SHA" ]; then
            echo "The branch has moved past the failed commit; the newer run will be handled instead"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=$(git log --oneline "origin/$BASE..HEAD" --grep='\[ci-fix\]' | wc -l)
          echo "Previous attempts: $count of $MAX"
          if [ "$count" -ge "$MAX" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"

            # Warn only once per PR, not on every later failure
            marker="<!-- claude-fix-ci:limit -->"
            warned=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq "any(.comments[]; .body | contains(\"$marker\"))")
            if [ "$warned" = true ]; then
              echo "The PR was already told that the limit was reached"
            else
              body="O CI continua falhando após $count tentativas automáticas de correção. Parei por aqui; é preciso revisão humana. [Ver execução]($RUN_URL)"
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n%s' "$body" "$marker")"
            fi
          fi

      - name: Setup Laravel
        id: setup
        if: steps.check.outputs.skip != 'true'
        uses: datalogix/workflows/.github/actions/setup-laravel@v1
        with:
          php-version: ${{ inputs.php-version }}
          node-version: ${{ inputs.node-version }}

      - name: Fix CI with Claude Code
        if: steps.check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        env:
          APP_ENV: testing
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The trigger is Claude's own bot; the job already filters by branch and PR
          allowed_bots: "*"

          plugin_marketplaces: ${{ inputs.plugin-marketplaces }}
          plugins: ${{ inputs.plugins }}

          additional_permissions: |
            actions: read

          prompt: /laravel:fix-ci ${{ github.event.workflow_run.id }} ${{ env.PR_NUMBER }}

          claude_args: |
            --max-turns ${{ inputs.max-turns }}
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ steps.setup.outputs.mcp-config != '' && format('--mcp-config {0}', steps.setup.outputs.mcp-config) || '' }}
            --allowed-tools "${{ inputs.allowed-tools }}"
            --disallowed-tools "${{ inputs.disallowed-tools }}"
            --append-system-prompt "This is a single, non-interactive session: do not delegate work to background sub-agents and then wait for them, because the session cannot be resumed. Do everything synchronously and only end your turn when the task is complete. Before starting, load the laravel:conventions skill and follow all of its rules. ${{ inputs.extra-instructions }}"
