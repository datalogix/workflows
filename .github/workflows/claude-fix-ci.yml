name: claude-fix-ci

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: ""
        description: Empty reads .php-version, composer.lock or composer.json config.platform.php, otherwise latest
      node-version:
        type: string
        default: ""
        description: Empty reads .nvmrc or .node-version, otherwise the current LTS
      model:
        type: string
        default: sonnet
        description: Claude model (e.g. fable, opus, sonnet); empty uses the account default
      max-turns:
        type: number
        default: 60
        description: Maximum turns of Claude when fixing the CI
      timeout-minutes:
        type: number
        default: 45
        description: Timeout of the fix job
      max-attempts:
        type: number
        default: 2
        description: Maximum number of automatic fix commits per PR
      branch-prefix:
        type: string
        default: claude/
        description: Only fix PRs from branches with this prefix
      allowed-tools:
        type: string
        default: Read,Write,Edit,MultiEdit,Grep,Glob,Bash(*),mcp__laravel-boost__*
        description: Tools Claude may use, comma-separated
      disallowed-tools:
        type: string
        default: Bash(git push --force:*),Bash(git push -f:*),Bash(git push --delete:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh release:*),Bash(gh repo:*),Bash(gh secret:*)
        description: Tools Claude may not use, comma-separated; takes precedence over allowed-tools
      plugin-marketplaces:
        type: string
        default: ""
        description: Extra Claude Code plugin marketplaces, one per line, besides this repository's (at the same version as the workflows)
      plugins:
        type: string
        default: laravel@datalogix
        description: Claude Code plugins to install, one per line (name@marketplace)
      extra-instructions:
        type: string
        default: ""
        description: Extra instructions for this repository (no double quotes)
      language:
        type: string
        default: pt-BR
        description: Language of what Claude writes for the team (e.g. pt-BR, en; no double quotes); the fixed texts exist in pt-BR and en, other languages get pt-BR
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # Runs after a failed tests workflow (workflow_run), or inside the same run as the tests when called
  # from a pull_request workflow with needs (as the project workflow does)
  fix:
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number &&
        startsWith(github.event.workflow_run.head_branch, inputs.branch-prefix)
      ) || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, inputs.branch-prefix)
      )

    runs-on: ubuntu-latest

    timeout-minutes: ${{ inputs.timeout-minutes }}

    concurrency:
      group: claude-fix-ci-${{ github.repository }}-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
      cancel-in-progress: true

    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
      RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Read the team language
        id: language
        uses: datalogix/workflows/.github/actions/language@v2
        with:
          language: ${{ inputs.language }}

      - name: Check whether to run
        id: check
        shell: bash
        env:
          BASE: ${{ github.event.workflow_run.pull_requests[0].base.ref || github.event.pull_request.base.ref }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          MAX: ${{ inputs.max-attempts }}
          ENGLISH: ${{ steps.language.outputs.english }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$FAILED_SHA" ]; then
            echo "The branch has moved past the failed commit; the newer run will be handled instead"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=$(git log --oneline "origin/$BASE..HEAD" --grep='\[ci-fix\]' | wc -l)
          echo "Previous attempts: $count of $MAX"
          if [ "$count" -ge "$MAX" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"

            marker="<!-- claude-fix-ci:limit -->"
            warned=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq "any(.comments[]; .body | contains(\"$marker\"))")
            if [ "$warned" = true ]; then
              echo "The PR was already told that the limit was reached"
            else
              if [ "$ENGLISH" = true ]; then
                body="CI is still failing after $count automatic fix attempts. I stopped here; it needs a human review. [View run]($RUN_URL)"
              else
                body="O CI continua falhando após $count tentativas automáticas de correção. Parei por aqui; é preciso revisão humana. [Ver execução]($RUN_URL)"
              fi
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n%s' "$body" "$marker")"
            fi
          fi

      - name: Setup Laravel
        id: setup
        if: steps.check.outputs.skip != 'true'
        uses: datalogix/workflows/.github/actions/setup-laravel@v2
        with:
          php-version: ${{ inputs.php-version }}
          node-version: ${{ inputs.node-version }}

      - name: Locate the Datalogix plugins
        id: plugins
        if: steps.check.outputs.skip != 'true'
        uses: datalogix/workflows/.github/actions/plugins@v2

      - name: Fix CI with Claude Code
        if: steps.check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          APP_ENV: testing
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The trigger is Claude's own bot; the job already filters by branch and PR
          allowed_bots: "*"

          plugin_marketplaces: |
            ${{ steps.plugins.outputs.marketplace }}
            ${{ inputs.plugin-marketplaces }}
          plugins: ${{ inputs.plugins }}

          additional_permissions: |
            actions: read

          prompt: /laravel:fix-ci ${{ env.RUN_ID }} ${{ env.PR_NUMBER }}

          claude_args: |
            --max-turns ${{ inputs.max-turns }}
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ steps.setup.outputs.mcp-config != '' && format('--mcp-config {0}', steps.setup.outputs.mcp-config) || '' }}
            --allowed-tools "${{ inputs.allowed-tools }}"
            --disallowed-tools "${{ inputs.disallowed-tools }}"
            --append-system-prompt "This is a single, non-interactive session: do not delegate work to background sub-agents and then wait for them, because the session cannot be resumed. Do everything synchronously and only end your turn when the task is complete. Before starting, load the laravel:conventions skill and follow all of its rules. Team language: ${{ inputs.language }}. ${{ inputs.extra-instructions }}"
