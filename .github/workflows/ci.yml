name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the previous run; runs on main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint workflows
        shell: bash
        env:
          # Not updated by Dependabot: bump manually from https://github.com/rhysd/actionlint/releases
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v$ACTIONLINT_VERSION/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"

          # Point the examples at the local workflows so their inputs and secrets are checked too
          mkdir -p .lint/examples
          for f in examples/*.yml; do
            sed 's|datalogix/workflows/\(\.github/workflows/[^@]*\)@v[0-9]*|./\1|' "$f" > ".lint/$f"
          done

          # The project and package workflows call the other workflows: point them at the local ones too
          mkdir -p .lint/workflows
          for f in project package package-claude; do
            sed 's|datalogix/workflows/\(\.github/workflows/[^@]*\)@v[0-9]*|./\1|' ".github/workflows/$f.yml" > ".lint/workflows/$f.yml"
          done

          ./actionlint -color .github/workflows/*.yml .lint/examples/*.yml .lint/workflows/*.yml

      # actionlint only checks inline scripts; the actions keep theirs in files
      - name: Lint action scripts
        shell: bash
        run: shellcheck -x .github/actions/*/*.sh .github/actions/deploy/*/*.sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json

      - name: Test incident relay
        shell: bash
        working-directory: relay
        run: |
          npm ci
          npm test

      - name: Test setup command and action scripts
        shell: bash
        run: |
          npm ci
          npm test

      - name: Lint and check formatting
        shell: bash
        run: npm run lint

      - name: Validate Claude plugin
        shell: bash
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .
          npx -y @anthropic-ai/claude-code plugin validate plugins/core
          npx -y @anthropic-ai/claude-code plugin validate plugins/laravel
          npx -y @anthropic-ai/claude-code plugin validate plugins/js
          npx -y @anthropic-ai/claude-code plugin validate plugins/php

      - name: Locate the plugins
        id: plugins
        uses: ./.github/actions/plugins

      - name: Check the plugins path
        shell: bash
        env:
          MARKETPLACE: ${{ steps.plugins.outputs.marketplace }}
        run: test "$MARKETPLACE" = "$GITHUB_WORKSPACE"

  minimum-node:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read the lowest Node version
        id: engines
        shell: bash
        run: |
          engines=$(jq -r .engines.node package.json)
          if [[ ! "$engines" =~ ^\>=([0-9.]+)$ ]]; then
            echo "::error::Expected engines.node as >=X.Y, got $engines"
            exit 1
          fi
          echo "node=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.engines.outputs.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Test setup command and action scripts
        shell: bash
        run: |
          npm ci
          npm test

  setup-laravel:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        node: ["22", "24"]
        boost: [false, true]
        pm: [npm]
        include:
          # Empty versions exercise auto-detection (latest PHP, Node LTS)
          - php: ""
            node: ""
            boost: false
            pm: npm
          # Node 25+ no longer ships Corepack
          - php: "8.5"
            node: "25"
            boost: false
            pm: pnpm
          - php: "8.5"
            node: "24"
            boost: false
            pm: yarn

    name: setup-laravel (php ${{ matrix.php || 'auto' }}, node ${{ matrix.node || 'auto' }}, ${{ matrix.pm }}, boost ${{ matrix.boost }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: .central

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Create Laravel app
        shell: bash
        env:
          PM: ${{ matrix.pm }}
        run: |
          composer create-project laravel/laravel "$RUNNER_TEMP/app" --no-interaction --prefer-dist --no-scripts
          cp -a "$RUNNER_TEMP/app/." .

          # Simulate an older project whose .env.example points to MySQL
          sed -i -e '/DB_CONNECTION=/d' -e '/DB_DATABASE=/d' .env.example
          printf 'DB_CONNECTION=mysql\nDB_DATABASE=laravel\n' >> .env.example

          case "$PM" in
            pnpm)
              version=$(npm view pnpm version)
              npm pkg set packageManager="pnpm@$version"
              npx -y "pnpm@$version" install --lockfile-only
              ;;
            yarn)
              npm pkg set packageManager="yarn@1.22.22"
              npx -y yarn@1.22.22 install --ignore-scripts
              rm -rf node_modules
              ;;
          esac

      - name: Install Laravel Boost
        if: matrix.boost
        shell: bash
        run: composer require laravel/boost --dev --no-interaction

      - name: Run setup-laravel
        id: setup
        uses: ./.central/.github/actions/setup-laravel
        with:
          php-version: ${{ matrix.php }}
          node-version: ${{ matrix.node }}

      - name: Check environment
        shell: bash
        env:
          MCP_CONFIG: ${{ steps.setup.outputs.mcp-config }}
          BOOST: ${{ matrix.boost }}
          PHP: ${{ matrix.php }}
          NODE: ${{ matrix.node }}
        run: |
          set -x
          if [ -n "$PHP" ]; then
            test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "$PHP"
          fi
          if [ -n "$NODE" ]; then
            node --version | grep -q "^v$NODE\."
          fi
          grep -qx 'DB_CONNECTION=sqlite' .env
          grep -qx "DB_DATABASE=$PWD/database/database.sqlite" .env
          grep -q '^APP_KEY=base64:' .env
          test -f database/database.sqlite
          test "$(sqlite3 database/database.sqlite 'select count(*) from migrations')" -gt 0
          test -d node_modules
          test -f public/build/manifest.json

          if [ "$BOOST" = true ]; then
            test -f "$MCP_CONFIG"
            jq -e '.mcpServers["laravel-boost"].args[1] == "boost:mcp"' "$MCP_CONFIG"
          else
            test -z "$MCP_CONFIG"
          fi

      - name: Check Laravel Boost MCP server
        if: matrix.boost
        shell: bash
        env:
          MCP_CONFIG: ${{ steps.setup.outputs.mcp-config }}
          # Same environment as the Claude steps
          APP_ENV: testing
        run: |
          server='.mcpServers["laravel-boost"]'
          command=$(jq -r "$server.command" "$MCP_CONFIG")
          mapfile -t args < <(jq -r "$server.args[]" "$MCP_CONFIG")
          mapfile -t vars < <(jq -r "$server.env // {} | to_entries[] | \"\(.key)=\(.value)\"" "$MCP_CONFIG")

          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}'
          response=$(echo "$request" | timeout 30 env "${vars[@]}" "$command" "${args[@]}" || true)
          echo "$response"

          if ! grep -q '"serverInfo"' <<< "$response"; then
            echo "::error::The Laravel Boost MCP server did not answer the initialize request"
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: php artisan test

  # setup-laravel on a Symfony app (stack php): no Laravel environment or Boost, the test database migrated. sqlite is
  # set in .env.test; the servers as laravel-app-tests starts them for its database input (same images and URLs)
  setup-symfony:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres, mysql, mariadb]

    name: setup-symfony (${{ matrix.database }})

    services:
      database:
        image: ${{ matrix.database == 'postgres' && 'postgres:17' || matrix.database == 'mysql' && 'mysql:8.4' || matrix.database == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app
        ports:
          - 5432:5432
          - 3306:3306
        options: >-
          ${{ matrix.database == 'postgres' && '--health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20' || matrix.database == 'mariadb' && '--health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20' || '--health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-timeout 5s --health-retries 20' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: .central

      # As the step of laravel-app-tests that reads its database input
      - name: Point DATABASE_URL at the database service
        if: matrix.database != 'sqlite'
        shell: bash
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          case "$DATABASE" in
            postgres) url='postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8' ;;
            mysql) url='mysql://root:root@127.0.0.1:3306/app?serverVersion=8.4.0&charset=utf8mb4' ;;
            mariadb) url='mysql://root:root@127.0.0.1:3306/app?serverVersion=11.4.0-MariaDB&charset=utf8mb4' ;;
          esac
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none

      - name: Create Symfony app
        shell: bash
        run: |
          composer create-project symfony/skeleton "$RUNNER_TEMP/app" --no-interaction --prefer-dist
          cp -a "$RUNNER_TEMP/app/." .
          composer require symfony/orm-pack --no-interaction
          composer require --dev symfony/test-pack --no-interaction

          # The default .env points at Postgres; a project that tests on SQLite says so in .env.test (the servers set
          # DATABASE_URL in the environment, which wins over it)
          echo 'DATABASE_URL="sqlite:///%kernel.project_dir%/var/data_%kernel.environment%.db"' >> .env.test
          sha256sum .env .env.test > "$RUNNER_TEMP/env.sha256"

      - name: Run setup-laravel
        id: setup
        uses: ./.central/.github/actions/setup-laravel

      - name: Check environment
        shell: bash
        env:
          MCP_CONFIG: ${{ steps.setup.outputs.mcp-config }}
          DATABASE: ${{ matrix.database }}
          APP_ENV: test
        run: |
          set -x
          # Symfony's committed .env files are left as they were, and no Laravel .env or Boost config is written
          sha256sum -c "$RUNNER_TEMP/env.sha256"
          test ! -f database/database.sqlite
          test -z "$MCP_CONFIG"
          # The test database (Doctrine's _test suffix on the servers) exists and answers
          php bin/console dbal:run-sql 'SELECT 1'
          if [ "$DATABASE" = sqlite ]; then
            test -f var/data_test.db
          fi

      - name: Run tests
        shell: bash
        run: php bin/phpunit

  # Single status check for branch protection, so it does not depend on the matrix job names
  all-checks:
    if: always()

    needs: [lint, minimum-node, setup-laravel, setup-symfony]

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Check results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
