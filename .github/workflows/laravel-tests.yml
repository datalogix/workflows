name: laravel-tests

on:
  workflow_call:
    inputs:
      os:
        type: string
        default: '["ubuntu-latest"]'
      php:
        type: string
        default: '["8.2", "8.3", "8.4", "8.5"]'
      laravel:
        type: string
        default: '["^12.0", "^13.0"]'
      stability:
        type: string
        default: '["prefer-lowest", "prefer-stable"]'
      exclude:
        type: string
        default: |
          [
            {"laravel": "^13.0", "php": "8.2"},
            {"stability": "prefer-lowest", "php": "8.4"},
            {"stability": "prefer-lowest", "php": "8.5"}
          ]
      extensions:
        type: string
        default: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
      test-command:
        type: string
        default: vendor/bin/phpunit
      coverage:
        type: boolean
        default: true
      coverage-driver:
        type: string
        default: pcov
        description: pcov (faster) or xdebug
      timeout-minutes:
        type: number
        default: 30
      pint:
        type: boolean
        default: true
        description: Run Laravel Pint on the files changed by the PR (requires Pint 1.20+ in require-dev)
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    timeout-minutes: ${{ inputs.timeout-minutes }}

    # A new push to a PR cancels the previous run; runs on main always finish
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        php: ${{ fromJSON(inputs.php) }}
        laravel: ${{ fromJSON(inputs.laravel) }}
        stability: ${{ fromJSON(inputs.stability) }}
        exclude: ${{ fromJSON(inputs.exclude) }}

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.extensions }}
          coverage: ${{ inputs.coverage && inputs.coverage-driver || 'none' }}

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: ${{ inputs.test-command }}

      - name: Coverage
        if: inputs.coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Code style does not depend on the matrix, so it runs once, next to the tests
  pint:
    if: inputs.pint && github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: ${{ inputs.timeout-minutes }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-pint
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Pint
        id: pint
        shell: bash
        env:
          PHP: ${{ inputs.php }}
        run: |
          if jq -e '.["require-dev"]["laravel/pint"] // .require["laravel/pint"]' composer.json >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            # Highest PHP version of the matrix, which the package is known to support
            echo "php=$(jq -r 'max_by(split(".") | map(tonumber))' <<< "$PHP")" >> "$GITHUB_OUTPUT"
          else
            echo "laravel/pint is not required by composer.json, skipping"
          fi

      - name: Setup PHP
        if: steps.pint.outputs.enabled
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.pint.outputs.php }}
          extensions: ${{ inputs.extensions }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        if: steps.pint.outputs.enabled
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        if: steps.pint.outputs.enabled
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-pint-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-pint-${{ runner.os }}-

      - name: Install dependencies
        if: steps.pint.outputs.enabled
        shell: bash
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # Only the files changed by the PR, so existing style issues do not fail the build
      - name: Laravel Pint
        if: steps.pint.outputs.enabled
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: vendor/bin/pint --test --diff="origin/$BASE"
