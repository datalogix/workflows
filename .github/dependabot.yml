version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-laravel
      - /.github/actions/setup-js
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    # The references to this repository's own workflows and actions move together with a new major, by hand (see
    # docs/maintaining.md), and the major tag does not exist until its release
    ignore:
      - dependency-name: datalogix/workflows

  - package-ecosystem: npm
    directories:
      - /
      - /relay
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: chore
