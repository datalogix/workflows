name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    uses: datalogix/workflows/.github/workflows/claude.yml@v1
    secrets: inherit
    # All inputs are optional:
    # with:
    #   model: sonnet
    #   plan-model: opus
    #   php-version: "8.3"
    #   extra-instructions: This project uses Livewire; prefer Livewire components over controllers.
