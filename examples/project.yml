name: datalogix

# The only workflow file a project needs. Every event below is handled by
# datalogix/workflows; jobs that do not apply to an event are skipped.
on:
  issues:
    types: [assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  # Problems detected by the monitoring service (Nightwatch), sent by the relay (relay/)
  repository_dispatch:
    types: [incident]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  pipeline:
    uses: datalogix/workflows/.github/workflows/project.yml@v2
    secrets: inherit
    # All inputs are optional:
    # with:
    #   php-version: "8.3"
    #   deploy: forge
    #   production-branch: main   # also add the default branch to push.branches, e.g. [develop, main]
    #   count-author: true
    #   github-deployments: false   # no record in the repository's Deployments
    #   security-fail-on: medium
    #   extra-instructions: This project uses Livewire; prefer Livewire components over controllers.
    #   language: en   # what is written for the team; pt-BR by default
