name: datalogix

# The workflow file of a package with the Claude layers or the risk gate, as .github/workflows/datalogix.yml (without
# them, examples/package.yml). Every event below is handled by datalogix/workflows; jobs that do not apply to an event
# are skipped. The tests keep contents: read; only the claude job gets the permissions of Claude and the risk gate.
on:
  issues:
    types: [assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Required when the repository uses a merge queue
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: datalogix/workflows/.github/workflows/package.yml@v2
    # Only CODECOV_TOKEN is used, for coverage reports
    secrets: inherit
    # All inputs are optional:
    # with:
    #   laravel: '["^11.0", "^12.0", "^13.0"]'
    #   php: '["8.3", "8.4", "8.5"]'
    #   pint: false
    #   min-coverage: 90   # 100 by default; 0 turns the coverage check off
    #   api-check: true    # fail on pull requests that break the public API (js: check what is published)

  claude:
    # After the tests, also when they fail, so Claude can fix the tests of its own pull requests
    needs: pipeline
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: datalogix/workflows/.github/workflows/package-claude.yml@v2
    # CLAUDE_CODE_OAUTH_TOKEN, for the Claude layers
    secrets: inherit
    # Each layer is off unless set to true: claude (@claude, issues labeled claude or claude-plan, and fixes of Claude's
    # failed tests), review, security-review (required check claude / security / security) and risk-gate (required
    # check claude / gate / gate). Other inputs: stack, model, plan-model, fix-ci-model, extra-instructions, language,
    # security-fail-on, approvals-medium, approvals-high, count-author, extra-high-risk-paths
    with:
      tests-result: ${{ needs.pipeline.result }}
      claude: true
      review: true
      security-review: true
      risk-gate: true
